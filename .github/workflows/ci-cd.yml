name: CI/CD Pipeline - CI360 Theme

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # -------------------------------------------------------------
  # Job 1: CI - Linting, Syntax Validation & Integrity Checks
  # -------------------------------------------------------------
  lint-and-validate:
    name: Lint & Validate Theme Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: php-cli

      - name: PHP Syntax Check (Lint)
        run: |
          echo "Linting all PHP files for syntax errors..."
          ERRORS=0
          find . -name "*.php" -not -path "*/.*" -print0 | while IFS= read -r -d '' file; do
            php -l "$file" || ERRORS=$((ERRORS + 1))
          done
          if [ $ERRORS -gt 0 ]; then
            echo "::error::PHP syntax errors detected!"
            exit 1
          fi
          echo "All PHP files passed syntax checks successfully."

      - name: Validate Theme Structure
        run: |
          echo "Checking essential WordPress theme files..."
          test -f style.css || (echo "::error::style.css missing!" && exit 1)
          test -f index.php || (echo "::error::index.php missing!" && exit 1)
          test -f functions.php || (echo "::error::functions.php missing!" && exit 1)
          echo "Core theme structure is intact."

  # -------------------------------------------------------------
  # Job 2: Build & Package Production Theme Artifact (.zip)
  # -------------------------------------------------------------
  package-theme:
    name: Package Theme Release (.zip)
    runs-on: ubuntu-latest
    needs: lint-and-validate

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Deployable Theme Archive
        run: |
          THEME_SLUG="ci360-hello-child"
          mkdir -p build/${THEME_SLUG}
          
          # Copy all theme files excluding git and CI config
          rsync -av --exclude='.git' \
                    --exclude='.github' \
                    --exclude='build' \
                    --exclude='.DS_Store' \
                    ./ build/${THEME_SLUG}/
          
          cd build
          zip -r "${THEME_SLUG}.zip" "${THEME_SLUG}"
          cd ..
          echo "Theme package build/${THEME_SLUG}.zip created successfully."

      - name: Upload Theme Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ci360-hello-child-theme
          path: build/ci360-hello-child.zip
          retention-days: 30

  # -------------------------------------------------------------
  # Job 3: CD - Automated Deployment to Hosting (FTP / FTPS)
  # Active whenever FTP_SERVER secret is provided in GitHub Secrets
  # -------------------------------------------------------------
  deploy-hosting:
    name: Deploy to Hosting (FTP/FTPS)
    runs-on: ubuntu-latest
    needs: [lint-and-validate, package-theme]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Deployment Credentials
        id: check_credentials
        run: |
          if [ -n "${{ secrets.FTP_SERVER }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "FTP credentials detected. Proceeding with deployment."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "No FTP_SERVER secret found. Skipping automatic deployment step."
            echo "To enable auto-deploy, add FTP_SERVER, FTP_USERNAME, and FTP_PASSWORD in GitHub Secrets."
          fi

      - name: Deploy via FTP/FTPS
        if: steps.check_credentials.outputs.configured == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR || 'public_html/wp-content/themes/ci360-hello-child/' }}
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/build/**
            **/INSTALL.md
